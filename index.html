<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu RPG</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #171717;
      color: #f5f5f5;
      font-family: system-ui, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
    }

    h1 {
      font-size: 1.25rem;
      margin: 8px 0;
    }

    p {
      margin: 4px 0 12px;
      text-align: center;
      color: #d4d4d4;
    }

    #game {
      width: min(100%, 800px);
      display: flex;
      justify-content: center;
    }

    #game canvas {
      max-width: 100%;
      height: auto !important;
      border: 2px solid #525252;
      border-radius: 6px;
      image-rendering: pixelated;
    }
  </style>
</head>

<body>
  <h1>Meu RPG — Protótipo</h1>

  <p>Movimente o personagem com as setas do teclado ou WASD.</p>

  <div id="game"></div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
